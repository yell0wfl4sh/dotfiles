- defaults:
    link:
      create: true
      relink: true
      force: true

- clean: ['~']

- link:
    ~/.zshrc: zshrc
    ~/.bashrc: bashrc
    ~/.profile: profile
    ~/.tmux.conf: tmux.conf
    ~/.gitconfig: gitconfig
    ~/.gitignore_global: gitignore_global
    ~/.config/starship.toml: config/starship.toml
    ~/.config/terminator/config: config/terminator/config
    ~/.config/git/gitleaks.toml: config/git/gitleaks.toml
    ~/.config/git/ignore: config/git/ignore
    ~/.config/git/hooks/pre-commit: config/git/hooks/pre-commit
    ~/.config/git/hooks/pre-push: config/git/hooks/pre-push
    ~/.config/htop/htoprc: config/htop/htoprc
    ~/.config/environment.d/10-local-bin.conf: config/environment.d/10-local-bin.conf
    ~/.config/nvim/init.lua: config/nvim/init.lua
    ~/.config/nvim/lua: config/nvim/lua
    ~/.config/nvim/after: config/nvim/after

- shell:
  - [bash scripts/bootstrap-tokyo-night.sh, Installing Starship, JetBrainsMono Nerd Font & syncing GNOME Terminal]
