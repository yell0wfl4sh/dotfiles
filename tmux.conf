# ------------------------------------------------------------------------------
# Keybindings & Ergonomics (Preserving Ctrl+z prefix & vi mode)
# ------------------------------------------------------------------------------
setw -g mode-keys vi

unbind C-b
set -g prefix C-z
bind C-z send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on

# ------------------------------------------------------------------------------
# Mouse Selection & System Clipboard Integration (Terminator/VTE + Wayland/X11)
# ------------------------------------------------------------------------------
set -s set-clipboard on
set -s copy-command "$HOME/.local/bin/wl-copy"

# Keep selection highlighted after mouse drag/click copy instead of vanishing immediately
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear

# Single-click without dragging exits copy-mode; drag starts a fresh selection
bind -T copy-mode-vi MouseUp1Pane send -X cancel
bind -T copy-mode    MouseUp1Pane send -X cancel

# Double/triple-click selects word/line, copies to clipboard, and keeps selection visible
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "copy-mode -H ; send -X select-word ; send -X copy-pipe-no-clear"
bind -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "copy-mode -H ; send -X select-line ; send -X copy-pipe-no-clear"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear
bind -T copy-mode    DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear
bind -T copy-mode    TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear

# Ergonomic vi copy-mode bindings (v / Ctrl-v to select, y / Enter to copy & exit, Esc to cancel)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape if -F "#{selection_present}" "send -X clear-selection" "send -X cancel"

# ------------------------------------------------------------------------------
# Truecolor (24-bit RGB) Passthrough — Essential for Tokyo Night & agy
# ------------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:Tc"

# ------------------------------------------------------------------------------
# Tokyo Night Theme — Borders, Copy-Mode Selection & Messages
# ------------------------------------------------------------------------------
# Eliminates harsh yellow copy-mode highlight; uses crisp Tokyo Night indigo
setw -g mode-style "fg=#c0caf5,bg=#2e3c64,bold"
set -g copy-mode-match-style "fg=#16161e,bg=#7dcfff"
set -g copy-mode-current-match-style "fg=#16161e,bg=#e0af68,bold"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

set -g message-style "fg=#c0caf5,bg=#24283b,bold"
set -g message-command-style "fg=#7dcfff,bg=#16161e,bold"
set -g display-panes-active-colour "#7aa2f7"
set -g display-panes-colour "#565f89"

# ------------------------------------------------------------------------------
# Tokyo Night Powerline Pill Status Bar
# ------------------------------------------------------------------------------
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#16161e,fg=#c0caf5"

set -g status-left-length 60
set -g status-right-length 100

set -g status-left "#[fg=#9ece6a,bg=#16161e]#[fg=#16161e,bg=#9ece6a,bold]❐ #S #[fg=#9ece6a,bg=#16161e] "

setw -g window-status-separator " "
setw -g window-status-format "#[fg=#24283b,bg=#16161e]#[fg=#a9b1d6,bg=#24283b]#I: #W#[fg=#24283b,bg=#16161e]"
setw -g window-status-current-format "#[fg=#7aa2f7,bg=#16161e]#[fg=#16161e,bg=#7aa2f7,bold]#I: #W ✱#[fg=#7aa2f7,bg=#16161e]"
setw -g window-status-activity-style "fg=#e0af68,bg=#16161e"
setw -g window-status-bell-style "fg=#f7768e,bg=#16161e,bold"

set -g status-right "#(git -C '#{pane_current_path}' rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's|.*|#[fg=#24283b,bg=#16161e]#[fg=#7dcfff,bg=#24283b] & #[fg=#24283b,bg=#16161e] |')#[fg=#24283b,bg=#16161e]#[fg=#c0caf5,bg=#24283b]󰒋 #h#[fg=#24283b,bg=#16161e] #[fg=#bb9af7,bg=#16161e]#[fg=#16161e,bg=#bb9af7,bold] %H:%M#[fg=#bb9af7,bg=#16161e]"
